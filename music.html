<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shwany Music</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── 전체 레이아웃 ── */
    .music-wrap {
      display: flex;
      height: 100vh;
      padding-top: 64px;
      padding-bottom: 90px;
    }

    /* ── 사이드바 ── */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: #111;
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px 0;
    }

    .sidebar-section {
      padding: 0 16px;
      margin-bottom: 32px;
    }

    .sidebar-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #666;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding: 0 8px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      color: #aaa;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .sidebar-item:hover {
      background: rgba(255,255,255,0.06);
      color: white;
    }

    .sidebar-item.active {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .sidebar-item .icon {
      font-size: 1.1rem;
      width: 20px;
      text-align: center;
    }

    /* 플레이리스트 커버 */
    .pl-cover {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }

    .pl-info {
      overflow: hidden;
    }

    .pl-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #ddd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pl-count {
      font-size: 0.72rem;
      color: #666;
      margin-top: 2px;
    }

    /* ── 메인 콘텐츠 ── */
    .music-main {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    .music-main::-webkit-scrollbar { width: 4px; }
    .music-main::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    /* ── 플레이리스트 헤더 ── */
    .pl-header {
      display: flex;
      gap: 32px;
      align-items: flex-end;
      margin-bottom: 40px;
    }

    .pl-header-cover {
      width: 200px;
      height: 200px;
      border-radius: 12px;
      object-fit: cover;
      background: linear-gradient(135deg, #1e1e1e, #333);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }

    .pl-header-info {
      padding-bottom: 8px;
    }

    .pl-header-type {
      font-size: 0.75rem;
      font-weight: 700;
      color: #aaa;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .pl-header-title {
      font-size: 3rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 12px;
      letter-spacing: -1px;
    }

    .pl-header-desc {
      font-size: 0.88rem;
      color: #aaa;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .pl-header-meta {
      font-size: 0.8rem;
      color: #666;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pl-header-meta span { color: #aaa; }

    /* 재생 버튼 */
    .pl-actions {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 32px;
    }

    .btn-pl-play {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #e50914;
      border: none;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 8px 24px rgba(229,9,20,0.4);
    }

    .btn-pl-play:hover {
      transform: scale(1.08);
      background: #ff1a26;
    }

    .btn-shuffle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: #aaa;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-shuffle:hover {
      color: white;
      border-color: white;
    }

    .btn-shuffle.active {
      color: #e50914;
      border-color: #e50914;
    }

    /* ── 트랙 리스트 ── */
    .track-list-header {
      display: grid;
      grid-template-columns: 40px 1fr 1fr 60px;
      gap: 16px;
      padding: 8px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 8px;
      font-size: 0.72rem;
      color: #666;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .track-item {
      display: grid;
      grid-template-columns: 40px 1fr 1fr 60px;
      gap: 16px;
      padding: 10px 16px;
      border-radius: 8px;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }

    .track-item:hover {
      background: rgba(255,255,255,0.06);
    }

    .track-item.playing {
      background: rgba(229,9,20,0.08);
    }

    .track-num {
      font-size: 0.85rem;
      color: #666;
      text-align: center;
      font-weight: 500;
    }

    .track-item.playing .track-num {
      color: #e50914;
    }

    /* 재생 중 애니메이션 */
    .playing-bars {
      display: none;
      gap: 2px;
      align-items: flex-end;
      height: 16px;
      justify-content: center;
    }

    .track-item.playing .playing-bars { display: flex; }
    .track-item.playing .track-num-text { display: none; }

    .playing-bars span {
      width: 3px;
      background: #e50914;
      border-radius: 2px;
      animation: bar 0.8s ease infinite alternate;
    }

    .playing-bars span:nth-child(1) { height: 8px;  animation-delay: 0s; }
    .playing-bars span:nth-child(2) { height: 14px; animation-delay: 0.2s; }
    .playing-bars span:nth-child(3) { height: 6px;  animation-delay: 0.4s; }

    @keyframes bar {
      from { transform: scaleY(0.4); }
      to   { transform: scaleY(1); }
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .track-cover {
      width: 42px;
      height: 42px;
      border-radius: 6px;
      object-fit: cover;
      background: #2a2a2a;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .track-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
    }

    .track-text { overflow: hidden; }

    .track-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-item.playing .track-title { color: #e50914; }

    .track-artist {
      font-size: 0.75rem;
      color: #777;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-album {
      font-size: 0.8rem;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-duration {
      font-size: 0.8rem;
      color: #666;
      text-align: right;
    }

    /* 관련 영상 뱃지 */
    .track-video-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(229,9,20,0.15);
      border: 1px solid rgba(229,9,20,0.3);
      color: #e50914;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .track-video-badge:hover {
      background: rgba(229,9,20,0.3);
    }

    /* ── 하단 플레이어 바 ── */
    .player-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 90px;
      background: rgba(18,18,18,0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 24px;
      z-index: 999;
    }

    /* 현재 곡 정보 */
    .player-track {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 260px;
      min-width: 260px;
    }

    .player-cover {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      background: #2a2a2a;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .player-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .player-track-text { overflow: hidden; }

    .player-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      font-size: 0.75rem;
      color: #888;
      margin-top: 3px;
    }

    /* 컨트롤 */
    .player-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .player-btns {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover { color: white; transform: scale(1.1); }
    .ctrl-btn.active { color: #e50914; }

    .ctrl-btn-main {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: white;
      border: none;
      color: black;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .ctrl-btn-main:hover {
      transform: scale(1.08);
      background: #eee;
    }

    /* 프로그레스 바 */
    .player-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      max-width: 600px;
    }

    .progress-time {
      font-size: 0.72rem;
      color: #666;
      min-width: 36px;
      text-align: center;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: height 0.2s;
    }

    .progress-bar:hover { height: 6px; }

    .progress-fill {
      height: 100%;
      background: white;
      border-radius: 4px;
      position: relative;
      transition: width 0.1s linear;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .progress-bar:hover .progress-fill::after { opacity: 1; }

    /* 볼륨 */
    .player-volume {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 160px;
      min-width: 160px;
      justify-content: flex-end;
    }

    .volume-icon {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .volume-icon:hover { color: white; }

    .volume-bar {
      width: 90px;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }

    .volume-fill {
      height: 100%;
      background: white;
      border-radius: 4px;
      width: 70%;
    }

    /* ── 반응형 ── */
    @media (max-width: 768px) {
      .sidebar { display: none; }

      .music-main { padding: 20px 16px; }

      .pl-header {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 20px;
      }

      .pl-header-cover {
        width: 160px;
        height: 160px;
      }

      .pl-header-title { font-size: 2rem; }

      .pl-actions { justify-content: center; }

      .track-list-header,
      .track-item {
        grid-template-columns: 32px 1fr 60px;
      }

      .track-album { display: none; }

      .player-bar { padding: 0 16px; gap: 12px; }

      .player-track { width: auto; min-width: 0; flex: 1; }

      .player-volume { display: none; }

      .player-controls { flex: 2; }
    }

    /* ── Now Playing 뷰 ── */
.now-playing-view {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, #1a0a2e 0%, #0d0d1a 60%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 32px;
  z-index: 10;
  animation: npFadeIn 0.4s ease;
}

@keyframes npFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.np-back-btn {
  position: absolute;
  top: 24px;
  left: 24px;
  background: rgba(255,255,255,0.08);
  border: none;
  color: #aaa;
  font-size: 0.85rem;
  padding: 8px 16px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s;
}

.np-back-btn:hover {
  background: rgba(255,255,255,0.15);
  color: white;
}

.np-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  width: 100%;
  max-width: 420px;
}

/* 앨범 커버 */
.np-cover {
  width: 600px;   /* 280px → 320px */
  height: 350px;  /* 280px → 320px */
  border-radius: 20px;
  background: linear-gradient(135deg, #2a1a4e, #1a2a4e);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 6rem;  /* 5rem → 6rem */
  box-shadow: 0 30px 80px rgba(0,0,0,0.6),
              0 0 60px rgba(100,60,200,0.3);
  overflow: hidden;
  animation: coverFloat 4s ease-in-out infinite;
  flex-shrink: 0;
}
.np-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 20px;
}

@keyframes coverFloat {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-8px); }
}

/* 곡 정보 */
.np-info {
  text-align: center;
}

.np-title {
  font-size: 2.2rem;  /* 1.6rem → 2.2rem */
  font-weight: 800;
  width: 300;
  color: white;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.np-artist {
  font-size: 1.3rem;  /* 1rem → 1.3rem */
  color: #aaa;
  margin-bottom: 4px;
}

.np-album {
  font-size: 1rem;  /* 0.8rem → 1rem */
  color: #666;
  margin-bottom: 15px;
}

/* 진행바 */
.np-progress-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
}

.np-time {
  font-size: 0.9rem;  /* 0.75rem → 0.9rem */
  color: #666;
  min-width: 40px;
}

.np-progress-bar {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  cursor: pointer;
  position: relative;
}

.np-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #7b4fff, #e50914);
  border-radius: 4px;
  transition: width 0.1s linear;
}

.np-progress-bar:hover .np-progress-fill {
  background: linear-gradient(90deg, #9b6fff, #ff3a44);
}

/* 컨트롤 */
.np-controls {
  display: flex;
  align-items: center;
  gap: 28px;
}

.np-ctrl-btn {
  background: none;
  border: none;
  color: #aaa;
  font-size: 1.8rem;  /* 1.3rem → 1.8rem */
  cursor: pointer;
  transition: all 0.2s;
  padding: 10px;
  border-radius: 50%;
}

.np-ctrl-main {
  width: 80px;   /* 64px → 80px */
  height: 80px;  /* 64px → 80px */
  border-radius: 50%;
  background: linear-gradient(135deg, #7b4fff, #e50914);
  border: none;
  color: white;
  font-size: 2rem;  /* 1.5rem → 2rem */
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 30px rgba(123,79,255,0.5);
  transition: all 0.2s;
}

.np-ctrl-btn:hover {
  color: white;
  background: rgba(255,255,255,0.08);
}

.np-ctrl-btn.active {
  color: #7b4fff;
}


.np-ctrl-main:hover {
  transform: scale(1.08);
  box-shadow: 0 12px 40px rgba(123,79,255,0.7);
}

/* 볼륨 */
.np-volume {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.np-volume-bar {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  cursor: pointer;
}

.np-volume-fill {
  height: 100%;
  background: rgba(255,255,255,0.4);
  border-radius: 4px;
}

.np-video-wrap {
  display: flex;
  justify-content: center;
}

.np-video-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(229,9,20,0.15);
  border: 1px solid rgba(229,9,20,0.4);
  color: #e50914;
  font-size: 0.95rem;
  font-weight: 600;
  padding: 10px 20px;
  border-radius: 24px;
  text-decoration: none;
  transition: all 0.2s;
}

.np-video-btn:hover {
  background: rgba(229,9,20,0.3);
  border-color: #e50914;
  transform: scale(1.04);
  color: #ff3a44;
}

/* music-main 상대 위치 */
.music-main {
  position: relative;
}
  </style>
</head>
<body>

  <!-- ── 네비게이션 ── -->
  <nav class="navbar scrolled" id="navbar">
    <div class="nav-left">
      <a class="logo" href="index.html">🎬 Shwany</a>
      <ul class="nav-menu">
        <li><a href="index.html">메인</a></li>
        <li><a href="list.html">정렬 알고리즘</a></li>
        <li><a href="search.html">탐색 알고리즘</a></li>
        <li><a href="music.html" class="active">청각 알고리즘</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <button class="nav-search-btn" onclick="location.href='search.html'">🔍</button>
    </div>
  </nav>

  <!-- ── 메인 레이아웃 ── -->
  <div class="music-wrap">

    <!-- 사이드바 -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">메뉴</div>
        <div class="sidebar-item active" onclick="showAll()">
          <span class="icon">🎵</span> 전체 트랙
        </div>
        <div class="sidebar-item" onclick="showAll()">
          <span class="icon">🔥</span> 인기 트랙
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">플레이리스트</div>
        <div id="sidebarPlaylists"></div>
      </div>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="music-main" id="musicMain">


        <!-- Now Playing 뷰 -->
<div class="now-playing-view" id="nowPlayingView" style="display:none;">
  <button class="np-back-btn" onclick="closeNowPlaying()">← 목록으로</button>
  
  <div class="np-content">
    <!-- 앨범 커버 -->
    <div class="np-cover" id="npCover">🎵</div>
    
    <!-- 곡 정보 -->
    <div class="np-info">
      <div class="np-title" id="npTitle">-</div>
      <div class="np-artist" id="npArtist">-</div>
      <div class="np-album" id="npAlbum">-</div>
      <div class="np-video-wrap" id="npVideoWrap" style="display:none;">
  <a class="np-video-btn" id="npVideoBtn" href="#">
    🎬 <span id="npVideoTitle">관련 영상 보기</span>
  </a>
</div>
    </div>

    <!-- 진행바 -->
    <div class="np-progress-wrap">
      <span class="np-time" id="npCurrentTime">0:00</span>
      <div class="np-progress-bar" id="npProgressBar" onclick="seekTo(event)">
        <div class="np-progress-fill" id="npProgressFill" style="width:0%"></div>
      </div>
      <span class="np-time" id="npTotalTime">0:00</span>
    </div>

    <!-- 컨트롤 -->
    <div class="np-controls">
      <button class="np-ctrl-btn" id="npBtnRepeat" onclick="document.getElementById('btnRepeat').click()">🔁</button>
      <button class="np-ctrl-btn" onclick="prevTrack()">⏮</button>
      <button class="np-ctrl-main" id="npBtnPlayPause" onclick="togglePlay()">▶</button>
      <button class="np-ctrl-btn" onclick="nextTrack()">⏭</button>
      <button class="np-ctrl-btn" id="npBtnShuffle" onclick="toggleShuffle()">🔀</button>
    </div>

    <!-- 볼륨 -->
    <div class="np-volume">
      <button class="volume-icon" onclick="toggleMute()">🔊</button>
      <div class="np-volume-bar" onclick="setVolume(event)">
        <div class="np-volume-fill" id="npVolumeFill"></div>
      </div>
    </div>
  </div>
</div>

      <!-- 플레이리스트 헤더 -->
      <div class="pl-header">
        <div class="pl-header-cover" id="plCover">🎵</div>
        <div class="pl-header-info">
          <div class="pl-header-type">PLAYLIST</div>
          <h1 class="pl-header-title" id="plTitle">전체 트랙</h1>
          <p class="pl-header-desc" id="plDesc">Shwany의 모든 음악</p>
          <div class="pl-header-meta" id="plMeta"></div>
        </div>
      </div>

      <!-- 재생 버튼 -->
      <div class="pl-actions">
        <button class="btn-pl-play" id="btnPlPlay" title="전체 재생">▶</button>
        <button class="btn-shuffle" id="btnShuffle" title="셔플">🔀</button>
      </div>

      <!-- 트랙 리스트 -->
      <div class="track-list-header">
        <div>#</div>
        <div>제목</div>
        <div>앨범</div>
        <div style="text-align:right">⏱</div>
      </div>
      <div id="trackList"></div>

    </main>
  </div>

  <!-- ── 하단 플레이어 바 ── -->
  <div class="player-bar" id="playerBar">

    <!-- 현재 곡 정보 -->
    <div class="player-track">
      <div class="player-cover" id="playerCover">🎵</div>
      <div class="player-track-text">
        <div class="player-title" id="playerTitle">재생 중인 곡 없음</div>
        <div class="player-artist" id="playerArtist">-</div>
      </div>
    </div>

    <!-- 컨트롤 -->
    <div class="player-controls">
      <div class="player-btns">
        <button class="ctrl-btn" id="btnRepeat" title="반복">🔁</button>
        <button class="ctrl-btn" onclick="prevTrack()" title="이전">⏮</button>
        <button class="ctrl-btn-main" id="btnPlayPause" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" onclick="nextTrack()" title="다음">⏭</button>
        <button class="ctrl-btn" id="btnShuffleBar" title="셔플">🔀</button>
      </div>
      <div class="player-progress">
        <span class="progress-time" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar" onclick="seekTo(event)">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <span class="progress-time" id="totalTime">0:00</span>
      </div>
    </div>

    <!-- 볼륨 -->
    <div class="player-volume">
      <button class="volume-icon" onclick="toggleMute()">🔊</button>
      <div class="volume-bar" id="volumeBar" onclick="setVolume(event)">
        <div class="volume-fill" id="volumeFill"></div>
      </div>
    </div>

  </div>

  <!-- ── 오디오 엘리먼트 ── -->
  <audio id="audioPlayer"></audio>
  <script src="config.js"></script>
  <script>
    // ── 데이터 ──
    let catalog = null;
    let currentTrackIndex = 0;
    let currentPlaylist = [];
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;
    let isMuted = false;
    let volume = 0.7;

    const audio = document.getElementById('audioPlayer');
    audio.volume = volume;

    // ── 데이터 로드 ──
    async function loadData() {
      const res = await fetch(CONFIG.CATALOG_URL);
      catalog = await res.json();
      initMusic();
    }

    function initMusic() {
      renderSidebarPlaylists();
      showAll();
    }

    // ── 사이드바 플레이리스트 ──
    function renderSidebarPlaylists() {
      const container = document.getElementById('sidebarPlaylists');
      container.innerHTML = catalog.music.playlists.map(pl => `
        <div class="sidebar-item" onclick="showPlaylist(${pl.id})">
          <img class="pl-cover"
               src="${pl.cover}"
               onerror="this.style.display='none'"
               alt="">
          <div class="pl-info">
            <div class="pl-name">${pl.title}</div>
            <div class="pl-count">트랙 ${pl.tracks.length}개</div>
          </div>
        </div>
      `).join('');
    }


    function openNowPlaying() {
  document.getElementById('nowPlayingView').style.display = 'flex';
}

function closeNowPlaying() {
  document.getElementById('nowPlayingView').style.display = 'none';
}


    // ── 전체 트랙 보기 ──
    function showAll() {
      currentPlaylist = catalog.music.tracks;
      renderHeader({
        title: '전체 트랙',
        desc: 'Shwany의 모든 음악',
        cover: null,
        count: catalog.music.tracks.length
      });
      renderTracks(currentPlaylist);
      setActiveSidebar(0);
    }

    // ── 플레이리스트 보기 ──
    function showPlaylist(id) {
      const pl = catalog.music.playlists.find(p => p.id === id);
      if (!pl) return;
      currentPlaylist = pl.tracks.map(tid =>
        catalog.music.tracks.find(t => t.id === tid)
      ).filter(Boolean);

      renderHeader({
        title: pl.title,
        desc: pl.description,
        cover: pl.cover,
        count: currentPlaylist.length
      });
      renderTracks(currentPlaylist);
      setActiveSidebar(id);
    }

    // ── 헤더 렌더 ──
    function renderHeader({ title, desc, cover, count }) {
      document.getElementById('plTitle').textContent = title;
      document.getElementById('plDesc').textContent = desc;
      document.getElementById('plMeta').innerHTML =
        `<span>${count}개 트랙</span>`;

      const coverEl = document.getElementById('plCover');
      if (cover) {
        coverEl.innerHTML = `<img src="${cover}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:12px;">`;
      } else {
        coverEl.innerHTML = '🎵';
      }
    }

    // ── 트랙 리스트 렌더 ──
    function renderTracks(tracks) {
      const container = document.getElementById('trackList');
      container.innerHTML = tracks.map((track, i) => {
        if (!track) return '';
        const relatedVideo = track.relatedVideo
          ? catalog.videos.find(v => v.id === track.relatedVideo)
          : null;

        return `
          <div class="track-item ${isCurrentTrack(track) ? 'playing' : ''}"
               id="track-${track.id}"
               ondblclick="playTrack(${i})">
            <div class="track-num">
              <div class="playing-bars">
                <span></span><span></span><span></span>
              </div>
              <span class="track-num-text">${i + 1}</span>
            </div>
            <div class="track-info">
              <div class="track-cover">
                ${track.cover
                  ? `<img src="${track.cover}" alt="" onerror="this.parentElement.innerHTML='🎵'">`
                  : '🎵'}
              </div>
              <div class="track-text">
                <div class="track-title">${track.title}</div>
                <div class="track-artist">${track.artist}</div>
                ${relatedVideo ? `
                  <div class="track-video-badge"
                       onclick="event.stopPropagation(); location.href='player.html?id=${relatedVideo.id}'">
                    🎬 ${relatedVideo.title}
                  </div>` : ''}
              </div>
            </div>
            <div class="track-album">${track.album || '-'}</div>
            <div class="track-duration">${track.duration || '-'}</div>
          </div>
        `;
      }).join('');

      // 전체 재생 버튼
      document.getElementById('btnPlPlay').onclick = () => playTrack(0);
    }

    // ── playTrack 수정 ──
function playTrack(index) {
  if (index < 0 || index >= currentPlaylist.length) return;
  currentTrackIndex = index;
  const track = currentPlaylist[index];
  if (!track) return;

  if (!track.audioUrl) {
    updatePlayerUI(track);
    updateNowPlayingView(track);  // ← 추가
    openNowPlaying();             // ← 추가
    return;
  }

  audio.src = track.audioUrl;
  audio.play().then(() => {
    isPlaying = true;
    updatePlayerUI(track);
    updateNowPlayingView(track);  // ← 추가
    openNowPlaying();             // ← 추가
    updatePlayPauseBtn();
    updateTrackHighlight();
  }).catch(err => {
    console.error('재생 오류:', err);
  });
}

// ── Now Playing 뷰 업데이트 ──
function updateNowPlayingView(track) {
  document.getElementById('npTitle').textContent  = track.title;
  document.getElementById('npArtist').textContent = track.artist;
  document.getElementById('npAlbum').textContent  = track.album || '';

  const coverEl = document.getElementById('npCover');
  if (track.cover) {
    coverEl.innerHTML = `<img src="${track.cover}" alt="" 
      onerror="this.parentElement.innerHTML='🎵'">`;
  } else {
    coverEl.innerHTML = '🎵';
  }

  // ── 연관 동영상 ── ← 추가
  const videoWrap = document.getElementById('npVideoWrap');
  const videoBtn  = document.getElementById('npVideoBtn');
  const videoTitleEl = document.getElementById('npVideoTitle');

  if (track.relatedVideo) {
    const video = catalog.videos.find(v => v.id === track.relatedVideo);
    if (video) {
      videoTitleEl.textContent = video.title;
      videoBtn.href = `player.html?id=${video.id}`;
      videoWrap.style.display = 'flex';
    } else {
      videoWrap.style.display = 'none';
    }
  } else {
    videoWrap.style.display = 'none';  // 연관 영상 없으면 숨김
  }

  // 볼륨 바 동기화
  document.getElementById('npVolumeFill').style.width = (volume * 100) + '%';
}

    // ── 재생/일시정지 ──
    function togglePlay() {
      if (!audio.src) return;
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        audio.play();
        isPlaying = true;
      }
      updatePlayPauseBtn();
    }

    // ── 이전/다음 ──
    function prevTrack() {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
        return;
      }
      let idx = isShuffle
        ? Math.floor(Math.random() * currentPlaylist.length)
        : currentTrackIndex - 1;
      if (idx < 0) idx = currentPlaylist.length - 1;
      playTrack(idx);
    }

    function nextTrack() {
      let idx = isShuffle
        ? Math.floor(Math.random() * currentPlaylist.length)
        : currentTrackIndex + 1;
      if (idx >= currentPlaylist.length) idx = 0;
      playTrack(idx);
    }

    // ── 셔플 ──
    function toggleShuffle() {
      isShuffle = !isShuffle;
      document.getElementById('btnShuffle').classList.toggle('active', isShuffle);
      document.getElementById('btnShuffleBar').classList.toggle('active', isShuffle);
    }

    document.getElementById('btnShuffle').onclick = toggleShuffle;
    document.getElementById('btnShuffleBar').onclick = toggleShuffle;

    // ── 반복 ──
    document.getElementById('btnRepeat').onclick = () => {
      isRepeat = !isRepeat;
      document.getElementById('btnRepeat').classList.toggle('active', isRepeat);
      audio.loop = isRepeat;
    };

    // ── 볼륨 ──
    function setVolume(e) {
  const bar  = e.currentTarget;
  const rect = bar.getBoundingClientRect();
  volume = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  audio.volume = volume;
  isMuted = false;
  const pct = (volume * 100) + '%';
  document.getElementById('volumeFill').style.width   = pct;
  document.getElementById('npVolumeFill').style.width = pct;
}

    function toggleMute() {
      isMuted = !isMuted;
      audio.muted = isMuted;
      document.querySelector('.volume-icon').textContent = isMuted ? '🔇' : '🔊';
    }

    // ── 프로그레스 ──
    function seekTo(e) {
  const bar  = e.currentTarget;
  const rect = bar.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  if (audio.duration) audio.currentTime = ratio * audio.duration;
}

    audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const ratio = audio.currentTime / audio.duration;
  const pct   = (ratio * 100) + '%';

  document.getElementById('progressFill').style.width = pct;
  document.getElementById('npProgressFill').style.width = pct;
  document.getElementById('currentTime').textContent  = formatTime(audio.currentTime);
  document.getElementById('npCurrentTime').textContent = formatTime(audio.currentTime);
});

    audio.addEventListener('loadedmetadata', () => {
  const t = formatTime(audio.duration);
  document.getElementById('totalTime').textContent  = t;
  document.getElementById('npTotalTime').textContent = t;
});
    audio.addEventListener('ended', () => {
      if (!isRepeat) nextTrack();
    });

    // ── UI 업데이트 ──
    function updatePlayerUI(track) {
      document.getElementById('playerTitle').textContent = track.title;
      document.getElementById('playerArtist').textContent = track.artist;
      const coverEl = document.getElementById('playerCover');
      if (track.cover) {
        coverEl.innerHTML = `<img src="${track.cover}" alt="">`;
      } else {
        coverEl.innerHTML = '🎵';
      }
    }

    function updatePlayPauseBtn() {
  const icon = isPlaying ? '⏸' : '▶';
  document.getElementById('btnPlayPause').textContent  = icon;
  document.getElementById('npBtnPlayPause').textContent = icon;
}

    function updateTrackHighlight() {
      document.querySelectorAll('.track-item').forEach(el => el.classList.remove('playing'));
      const current = currentPlaylist[currentTrackIndex];
      if (current) {
        const el = document.getElementById(`track-${current.id}`);
        if (el) {
          el.classList.add('playing');
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }
    }

    function isCurrentTrack(track) {
      const current = currentPlaylist[currentTrackIndex];
      return current && current.id === track.id && isPlaying;
    }

    function setActiveSidebar(id) {
      document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    }

    // ── 시간 포맷 ──
    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // ── 볼륨 초기화 ──
    document.getElementById('volumeFill').style.width = (volume * 100) + '%';

    // ── 시작 ──
    loadData();
  </script>
</body>
</html>
