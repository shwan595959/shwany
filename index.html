  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <style>

  /* ── 히어로 배너 ── */

    
  .hero {
  position: relative;
  height: 100vh;
  overflow: hidden;
  margin-top: 0; /* 혹시 margin-top 있으면 제거 */
}

  .hero-slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.5s ease;
    transform: scale(1.05);
  }

  .hero-slide.active {
    opacity: 1;
    transform: scale(1);
    transition: opacity 1.5s ease, transform 8s ease;
  }

  .hero-gradient {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to right, rgba(10,10,10,0.95) 30%, rgba(10,10,10,0.3) 70%, transparent),
      linear-gradient(to top, rgba(10,10,10,1) 0%, transparent 55%),
      linear-gradient(to bottom, rgba(10,10,10,0.4) 0%, transparent 20%);
    z-index: 1;
  }

  .hero-content {
    position: absolute;
    bottom: 22%;
    left: 56px;
    z-index: 2;
    max-width: 560px;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #e50914, #ff4757);
    padding: 5px 16px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 15px rgba(229,9,20,0.4);
  }

  .hero-title {
    font-size: 3.8rem;
    font-weight: 900;
    line-height: 1.05;
    margin-bottom: 18px;
    width: 500px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.6);
    letter-spacing: -1px;
  }

  .hero-desc {
    font-size: 1rem;
    color: #ccc;
    line-height: 1.8;
    margin-bottom: 18px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .hero-meta {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 28px;
    font-size: 0.85rem;
    color: #bbb;
  }

  .hero-meta .match {
    color: #46d369;
    font-weight: 700;
    font-size: 0.95rem;
  }

  .hero-meta .rbadge {
    border: 1px solid rgba(255,255,255,0.4);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    backdrop-filter: blur(4px);
  }

  .hero-buttons {
    display: flex;
    gap: 14px;
  }

  .btn-play, .btn-more {
    padding: 14px 32px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.3px;
  }

  

  .btn-play {
    background: white;
    color: black;
    box-shadow: 0 4px 20px rgba(255,255,255,0.2);
  }

  .btn-play:hover {
    background: rgba(255,255,255,0.85);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(255,255,255,0.3);
  }

  .btn-more {
    background: rgba(255,255,255,0.12);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
  }

  .btn-more:hover {
    background: rgba(255,255,255,0.22);
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.4);
  }

  /* 슬라이드 인디케이터 */
  .hero-indicators {
    position: absolute;
    bottom: 13%;
    right: 56px;
    z-index: 2;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .indicator {
    width: 24px;
    height: 3px;
    background: rgba(255,255,255,0.3);
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.4s ease;
  }

  .indicator.active {
    background: white;
    width: 44px;
    box-shadow: 0 0 8px rgba(255,255,255,0.5);
  }

  /* 하단 썸네일 미리보기 */
  .hero-preview {
    position: absolute;
    bottom: 0;
    right: 0;
    z-index: 2;
    display: flex;
    gap: 10px;
    padding: 0 56px 44px;
  }

  .preview-thumb {
    width: 110px;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    opacity: 0.5;
    transition: all 0.35s ease;
  }


  
  .preview-thumb:hover {
    opacity: 0.8;
    transform: translateY(-3px);
  }
  .content
  .preview-thumb.active {
    border-color: white;
    opacity: 1;
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  }

  .preview-thumb img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
  }

  /* 콘텐츠 영역 */
  .content {
    position: relative;
    z-index: 10;
    margin-top: -80px;
    padding-bottom: 80px;
  }

  .video

  /* ── 모바일 반응형 ── */
@media (max-width: 768px) {

  /* 히어로 */
  .hero {
    height: 43vh;
  }

  
  
  .hero-gradient {
    background:
      linear-gradient(to top, rgba(10,10,10,1) 0%, transparent 60%),
      linear-gradient(to bottom, rgba(10,10,10,0.6) 0%, transparent 25%),
      linear-gradient(to right, rgba(10,10,10,0.7) 0%, transparent 100%);

  .hero-content {
    bottom: 18%;

  }

  .hero-title {
    font-size: 2rem;
    letter-spacing: -0.5px;
  }

  .hero-desc {
    font-size: 0.85rem;
    -webkit-line-clamp: 2;
  }

  .hero-meta {
    font-size: 0.75rem;
    gap: 8px;
    flex-wrap: wrap;
  }

  .hero-buttons {
    gap: 10px;
  }

  .btn-play, .btn-more {
    padding: 11px 20px;
    font-size: 0.85rem;
  }

  /* 인디케이터 */
  .hero-indicators {
    bottom: 10%;

  }

  /* 하단 썸네일 미리보기 숨김 */
  .hero-preview {

}

@media (max-width: 480px) {
  .hero-title {
    font-size: 1.6rem;

}

/* ── 대표 예고편 섹션 ── */
.trailer-section {
  position: relative;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}


/* 배경 이미지 */
.trailer-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transform: scale(1.08);
  animation: trailerZoom 12s ease forwards;
  filter: brightness(0.6);
}

@keyframes trailerZoom {
  from { transform: scale(1.08); }
  to   { transform: scale(1.0); }
}

/* 그라디언트 오버레이 */
.trailer-overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to top, rgba(10,10,10,1) 0%, transparent 50%),
    linear-gradient(to bottom, rgba(10,10,10,0.5) 0%, transparent 30%),
    linear-gradient(to right, rgba(10,10,10,0.7) 0%, transparent 60%);
  z-index: 1;
}

/* 콘텐츠 */
.trailer-content {
  position: absolute;
  bottom: 20%;
  left: 56px;
  z-index: 2;
  max-width: 600px;
  animation: trailerFadeUp 1.2s ease forwards;
  opacity: 0;
}

@keyframes trailerFadeUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* NEW 라벨 */
.trailer-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  font-weight: 800;
  letter-spacing: 3px;
  color: #e50914;
  margin-bottom: 16px;
  text-transform: uppercase;
}

.trailer-label-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #e50914;
  animation: pulse 1.5s ease infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.4; transform: scale(0.7); }
}

/* 제목 */
.trailer-title {
  font-size: 4.5rem;
  font-weight: 900;
  line-height: 1.0;
  letter-spacing: -2px;
  margin-bottom: 16px;
  text-shadow: 0 4px 30px rgba(0,0,0,0.8);
  background: linear-gradient(135deg, #ffffff 60%, #aaaaaa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* 서브 텍스트 */
.trailer-sub {
  font-size: 1rem;
  color: #bbb;
  line-height: 1.7;
  margin-bottom: 32px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 버튼 */
.trailer-actions {
  display: flex;
  gap: 16px;
  align-items: center;
}

.btn-trailer-play {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 36px;
  background: #e50914;
  color: white;
  border: none;
  border-radius: 50px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 8px 30px rgba(229,9,20,0.5);
  letter-spacing: 0.3px;
}

.btn-trailer-play:hover {
  background: #ff1a26;
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 12px 40px rgba(229,9,20,0.6);
}

.play-icon {
  width: 32px;
  height: 32px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
}

.btn-trailer-more {
  padding: 16px 32px;
  background: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 50px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  backdrop-filter: blur(10px);
}

.btn-trailer-more:hover {
  background: rgba(255,255,255,0.2);
  transform: translateY(-3px);
  border-color: rgba(255,255,255,0.5);
}

/* ── 비디오 플레이어 오버레이 ── */
.trailer-video-wrap {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  backdrop-filter: blur(8px);
}

.trailer-video-wrap.open {
  opacity: 1;
  pointer-events: all;
}

.trailer-video-inner {
  position: relative;
  width: 90vw;
  max-width: 1100px;
  aspect-ratio: 16/9;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,0.8);
  transform: scale(0.9);
  transition: transform 0.4s ease;
}

.trailer-video-wrap.open .trailer-video-inner {
  transform: scale(1);
}

.trailer-close {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 10;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.trailer-close:hover {
  background: #e50914;
  border-color: #e50914;
  transform: scale(1.1);
}

/* ── 스크롤 유도 ── */
.trailer-scroll-hint {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: rgba(255,255,255,0.4);
  font-size: 0.75rem;
  letter-spacing: 1px;
  animation: scrollHint 2s ease infinite;
}

@keyframes scrollHint {
  0%, 100% { opacity: 0.4; transform: translateX(-50%) translateY(0); }
  50%       { opacity: 0.8; transform: translateX(-50%) translateY(6px); }
}

.scroll-arrow {
  font-size: 1.2rem;
}

/* ── 모바일 반응형 ── */
@media (max-width: 768px) {
  .trailer-content {
    left: 20px;
    right: 20px;
    bottom: 18%;
    max-width: 100%;
  }

  .trailer-title {
    font-size: 2.6rem;
    letter-spacing: -1px;
  }

  .trailer-sub {
    font-size: 0.88rem;
    -webkit-line-clamp: 2;
  }

  .btn-trailer-play {
    padding: 13px 24px;
    font-size: 0.9rem;
  }

  .btn-trailer-more {
    padding: 13px 20px;
    font-size: 0.9rem;
  }

  .trailer-video-inner {
    width: 96vw;
  }
}

@media (max-width: 480px) {
  .trailer-title {
    font-size: 2rem;
  }

  .trailer-actions {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .btn-trailer-play,
  .btn-trailer-more {
    width: 100%;
    justify-content: center;
  }
}

    
  </style>
</head>

  <script>

    // ── app.js 로드 실패 대비 폴백 ──
window.addEventListener('load', () => {
  if (typeof goPlayer === 'undefined') {
    console.error('❌ app.js 로드 실패! goPlayer 없음')
  } else {
    console.log('✅ app.js 정상 로드됨')
  }
})
    let videos       = []
    let currentSlide = 0
    let slideTimer   = null
    let featuredList = []
    let trailer = null
    
    // Refresh
    document.addEventListener('DOMContentLoaded', async () => {
      showLoading(true)
      setupNavScroll()

      try {
        const data = await loadAll()
videos       = data.videos
trailer      = data.trailer  // ← 추가!
renderUpcoming(data.upcoming)
featuredList = videos.filter(v => v.featured)
if (featuredList.length === 0) featuredList = videos.slice(0, 5)

buildSlides()
buildPreview()
buildIndicators()
showSlide(0)
startAutoSlide()
renderRows()
initTrailer()  // ← 추가! (videos랑 trailer 할당 후에 호출)


      } catch(e) {
        console.error(e)
        showError()
      }

      showLoading(false)
    })

    // Slide Generator
    function buildSlides() {
      const container = document.getElementById('heroSlides')
      container.innerHTML = featuredList.map((v, i) => `
        <div class="hero-slide" id="slide${i}"
          style="background-image: url('${v.thumbnail}')">
        </div>
      `).join('')
    }

// Preview
function renderUpcoming(upcomingList) {
  const container = document.getElementById('upcomingList')
  if (!upcomingList || upcomingList.length === 0) return

  container.innerHTML = upcomingList.map(v => {

    const release  = v.releaseDate

    return `
      <div class="upcoming-card">
        <img src="${v.thumbnail}" alt="${v.title}">
        <div class="upcoming-overlay">
          <div class="upcoming-lock">🔒</div>
          <div class="upcoming-date">${release} 공개</div>
          <div class="upcoming-title">${v.title}</div>
        </div>
      </div>
    `
  }).join('')
}

async function loadAll() {
  // ✅ 캐시 무력화
  const res  = await fetch(CONFIG.CATALOG_URL + '?t=' + Date.now())
  const data = await res.json()
  _cachedVideos = data.videos  // 직접 할당!
  
  return {
    videos   : data.videos,
    upcoming : data.upcoming || [],
    trailer : data.trailer,
    music : data.music
  }
}

    function buildPreview() {
      const container = document.getElementById('heroPreview')
      container.innerHTML = featuredList.map((v, i) => `
        <div class="preview-thumb ${i===0?'active':''}"
             id="prev${i}"
             onclick="showSlide(${i})">
          <img src="${v.thumbnail}" alt="${v.title}">
        </div>
      `).join('')
    }


    function buildIndicators() {
      const container = document.getElementById('heroIndicators')
      container.innerHTML = featuredList.map((_, i) => `
        <div class="indicator ${i===0?'active':''}"
             id="ind${i}"
             onclick="showSlide(${i})">
        </div>
      `).join('')
    }

    function showSlide(idx) {

      document.querySelectorAll('.hero-slide').forEach((s, i) => {
        s.classList.toggle('active', i === idx)
      })
      document.querySelectorAll('.preview-thumb').forEach((p, i) => {
        p.classList.toggle('active', i === idx)
      })
      document.querySelectorAll('.indicator').forEach((d, i) => {
        d.classList.toggle('active', i === idx)
      })

      // 히어로 콘텐츠 업데이트
      const v = featuredList[idx]
      document.getElementById('heroTitle').textContent = v.title
      document.getElementById('heroDesc').textContent  = v.description
      document.getElementById('heroMeta').innerHTML    = `
        <span class="match">✔ 오리지널(Original)</span>
        <span>${v.year}</span>
        <span>${v.duration}</span>
        <span class="rbadge">${v.rating}</span>
        <span class="dot"></span>
        <span class="evaluation">★ ${v.evaluation}</span>
      `
      document.getElementById('heroPlay').onclick = () => goPlayer(v.id)
      document.getElementById('heroMore').onclick = () => openDetail(v.id)

      currentSlide = idx
    }

    function startAutoSlide() {
      slideTimer = setInterval(() => {
        const next = (currentSlide + 1) % featuredList.length
        showSlide(next)
      }, 5000)
    }

    function renderRows() {
  // videoUrl 없는 영상 제외
  const filteredVideos = videos.filter(v => v.videoUrl && v.videoUrl.trim() !== '')

  const featured = filteredVideos.filter(v => v.featured)
  const action   = filteredVideos.filter(v => v.category === '액션')
  const drama    = filteredVideos.filter(v => v.category === '드라마')
  const comedy   = filteredVideos.filter(v => v.category === '코미디')

  document.getElementById('featuredList').innerHTML = featured.map(createCard).join('')
  document.getElementById('allList').innerHTML      = filteredVideos.map(createCard).join('')

  if (action.length) {
    document.getElementById('actionList').innerHTML = action.map(createCard).join('')
  } else {
    document.getElementById('actionRow').style.display = 'none'
  }

  if (drama.length) {
    document.getElementById('dramaList').innerHTML = drama.map(createCard).join('')
  } else {
    document.getElementById('dramaRow').style.display = 'none'
  }

  if (comedy.length) {
    document.getElementById('comedyList').innerHTML = comedy.map(createCard).join('')
  } else {
    document.getElementById('comedyRow').style.display = 'none'
  }
}

// ── 대표 예고편 ──
function initTrailer() {
  const featured = videos.find(v => v.id === trailer.videoId);
  if (!featured) return;

  document.getElementById('trailerBg').style.backgroundImage =
    `url('${featured.thumbnail}')`;

  document.getElementById('trailerTitle').textContent = featured.title;
  document.getElementById('trailerSub').textContent = featured.description;

  // ── 예고편 버튼 분기 ──
  const btnPlay = document.getElementById('btnTrailerPlay');

  if (!featured.videoUrl || featured.videoUrl.trim() === '') {
    // 예고편 없을 때
    btnPlay.disabled = true;
    btnPlay.style.opacity = '0.4';
    btnPlay.style.cursor = 'not-allowed';
    btnPlay.style.boxShadow = 'none';
    btnPlay.innerHTML = `<span class="play-icon">🔒</span><span>준비 중</span>`;
  } else {
    // 예고편 있을 때
    btnPlay.onclick = () => {
      const wrap = document.getElementById('trailerVideoWrap');
      const video = document.getElementById('trailerVideo');
      video.src = featured.videoUrl;
      wrap.classList.add('open');
      video.play();
    };
  }

  document.getElementById('btnTrailerMore').onclick = () => {
  openDetail(featured.id)
}

  document.getElementById('trailerClose').onclick = closeTrailer;

  document.getElementById('trailerVideoWrap').onclick = (e) => {
    if (e.target === document.getElementById('trailerVideoWrap')) {
      closeTrailer();
    }
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeTrailer();
  });
}


function closeTrailer() {
  const wrap = document.getElementById('trailerVideoWrap');
  const video = document.getElementById('trailerVideo');
  wrap.classList.remove('open');
  video.pause();
  video.src = '';
}
